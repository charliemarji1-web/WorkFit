<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkFit AI Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="container">

        <a href="index.html" class="logo">
            <img src="images/Revolutionary.png" alt="WorkFit AI Logo">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#planner">Planner</a>
            <a href="about.html">About</a>
            <a href="sample-workouts.html">Sample Workouts</a>
            <a href="sample-meals.html">Sample Meals</a>
            <a href="contact.html">Contact</a>

            <button
                id="darkModeBtn"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark mode"
            >
                🌙
            </button>
        </nav>

    </div>

</header>


<section class="hero">

    <div class="container">

        <h2>Your AI Fitness Coach</h2>

        <p>
            Generate a personalized workout and meal plan based on your goals,
            schedule, and lifestyle.
        </p>

        <button id="scrollButton" type="button">
            Create My Plan
        </button>

    </div>

</section>


<section id="planner">

    <div class="container">

        <h2>Create Your Fitness Plan</h2>

        <form id="planForm">

            <input
                id="age"
                type="number"
                placeholder="Age"
                required
            >

            <input
                id="height"
                type="number"
                placeholder="Height (inches)"
                required
            >

            <input
                id="weight"
                type="number"
                placeholder="Weight (lbs)"
                required
            >

            <select id="sex" required>

                <option value="">
                    Select Sex
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>

            <input
                id="goal"
                type="text"
                placeholder="Fitness Goal (lose weight, build muscle, etc.)"
                required
            >

            <textarea
                id="schedule"
                placeholder="Describe your weekly schedule..."
                required
            ></textarea>

            <button type="submit">
                Generate My Plan
            </button>

        </form>

    </div>

</section>


<section id="result">

    <div class="container">

        <h2>Your AI Plan</h2>

        <div id="output">
            <p>Your personalized plan will appear here...</p>
        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 WorkFit AI
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
